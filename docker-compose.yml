services:
  api:
    build: .
    image: research-ledger-api:latest
    container_name: research-ledger-api
    ports:
      - "8000:8000"
    volumes:
      - ledger-data:/app/data
    environment:
      LEDGER_DB_PATH: /app/data/ledger.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  ledger-data:
