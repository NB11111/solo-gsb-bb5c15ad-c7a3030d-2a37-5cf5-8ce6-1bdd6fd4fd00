services:
  api:
    build: .
    image: research-fund-ledger:latest
    container_name: research-fund-ledger
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      # 首次启动写入科研经费演示账套 (科目+凭证)；之后靠幂等键不会重复
      SEED_DEMO: "true"
    volumes:
      - ledger-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2))['status']=='ok' else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s

volumes:
  ledger-data:
